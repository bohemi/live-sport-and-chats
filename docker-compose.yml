services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
    - REDIS_URL=redis://redis:6379  
    restart: always
    depends_on:
      - redis

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    restart: always
    depends_on:
      - backend
#install redis only in docker and not in our system
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: always